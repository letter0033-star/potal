<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교감 인사업무 포털</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
        
        :root {
            --gw-blue: #005bac;
            --color-1: #4f46e5;
            --color-2: #0891b2;
            --color-3: #db2777;
            --color-4: #059669;
            --color-5: #d97706;
            --color-6: #7c3aed;
        }

        body, html {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            color: #1a1a1a;
            min-height: 100vh;
        }

        .white-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .badge-card {
            transition: all 0.25s ease-out;
            cursor: pointer;
            position: relative;
            background: white;
            border: 2px solid transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .badge-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .header-title {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chatbot-section {
            background: linear-gradient(90deg, #ffffff 0%, #f8fafc 100%);
            border-left: 6px solid var(--gw-blue);
        }

        .chatbot-btn {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* 배지별 컬러 테마 */
        .card-1 .icon-box { background: #eef2ff; color: var(--color-1); }
        .card-1:hover { border-color: var(--color-1); }
        .card-2 .icon-box { background: #ecfeff; color: var(--color-2); }
        .card-2:hover { border-color: var(--color-2); }
        .card-3 .icon-box { background: #fdf2f8; color: var(--color-3); }
        .card-3:hover { border-color: var(--color-3); }
        .card-4 .icon-box { background: #ecfdf5; color: var(--color-4); }
        .card-4:hover { border-color: var(--color-4); }
        .card-5 .icon-box { background: #fffbe6; color: var(--color-5); }
        .card-5:hover { border-color: var(--color-5); }
        .card-6 .icon-box { background: #f5f3ff; color: var(--color-6); }
        .card-6:hover { border-color: var(--color-6); }
    </style>
</head>
<body class="p-4 md:p-6 lg:p-8 flex flex-col justify-center">

    <div class="max-w-7xl mx-auto w-full space-y-4 md:space-y-6">
        <!-- 제목 영역 -->
        <header class="text-center space-y-1">
            <h2 class="text-blue-600 font-bold text-sm md:text-lg tracking-tight">초등학교 교감을 위한</h2>
            <h1 class="header-title font-black text-2xl md:text-4xl lg:text-5xl tracking-tighter leading-tight">
                교감 인사업무 포털
            </h1>
        </header>

        <!-- 교감 챗봇 영역 -->
        <section class="white-card chatbot-section p-4 md:p-6 lg:px-10 lg:py-6 flex flex-col md:flex-row items-center justify-between gap-4 md:gap-8">
            <div class="flex items-center gap-4 text-left">
                <div class="relative flex-shrink-0">
                    <div class="absolute inset-0 bg-blue-400 rounded-2xl animate-ping opacity-20"></div>
                    <div class="relative bg-gradient-to-br from-blue-500 to-indigo-600 p-4 rounded-2xl text-white shadow-lg">
                        <i class="fas fa-robot text-2xl md:text-3xl"></i>
                    </div>
                </div>
                <div class="space-y-0.5">
                    <div class="flex items-center gap-2">
                        <span class="bg-red-500 text-white text-[8px] md:text-[10px] font-black px-1.5 py-0.5 rounded shadow-sm uppercase">AI Powered</span>
                        <h3 class="text-lg md:text-2xl font-extrabold text-slate-800">교감 인사 업무 챗봇</h3>
                    </div>
                    <p class="text-slate-600 text-sm md:text-base font-medium">지침부터 복무까지, AI가 즉시 답변합니다.</p>
                </div>
            </div>
            <a href="https://letter0033-star.github.io/chatbot/" target="_blank" class="chatbot-btn w-full md:w-auto text-white font-black py-3 md:py-4 px-8 rounded-xl text-base md:text-lg flex items-center justify-center gap-3 group">
                <span>챗봇 시작하기</span>
                <i class="fas fa-arrow-right text-sm group-hover:translate-x-1 transition-transform"></i>
            </a>
        </section>

        <!-- 메인 배지 영역 -->
        <main class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 md:gap-4">
            <!-- 배지 1: 호봉획정프로그램 -->
            <a href="https://letter0033-star.github.io/pay/" target="_blank" class="badge-card white-card card-1 p-4 gap-4">
                <div class="icon-box shadow-sm">
                    <i class="fas fa-file-invoice-dollar text-xl"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-base md:text-lg font-extrabold text-slate-800">호봉획정프로그램</span>
                    <p class="text-slate-500 text-xs font-medium">초임 호봉 획정 및 재산정</p>
                </div>
            </a>

            <!-- 배지 2: 경력환산기 -->
            <a href="https://letter0033-star.github.io/school/" target="_blank" class="badge-card white-card card-2 p-4 gap-4">
                <div class="icon-box shadow-sm">
                    <i class="fas fa-calculator text-xl"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-base md:text-lg font-extrabold text-slate-800">경력환산기</span>
                    <p class="text-slate-500 text-xs font-medium">민법 제160조(역(曆)에 의한 계산)</p>
                </div>
            </a>
            
            <!-- 배지 3: 휴가 계산기 -->
            <a href="https://letter0033-star.github.io/t_vacation/" target="_blank" class="badge-card white-card card-3 p-4 gap-4">
                <div class="icon-box shadow-sm">
                    <i class="fas fa-calendar-check text-xl"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-base md:text-lg font-extrabold text-slate-800">휴가 계산기</span>
                    <p class="text-slate-500 text-xs font-medium">기간제교사 연가 및 병가 계산</p>
                </div>
            </a>

            <!-- 배지 4: 명예퇴직수당 계산기 -->
            <a href="https://letter0033-star.github.io/retirement/" target="_blank" class="badge-card white-card card-4 p-4 gap-4">
                <div class="icon-box shadow-sm">
                    <i class="fas fa-coins text-xl"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-base md:text-lg font-extrabold text-slate-800">명예퇴직수당 계산</span>
                    <p class="text-slate-500 text-xs font-medium">2026년 8월말 기준</p>
                </div>
            </a>

            <!-- 배지 5: 시간제근무기간제교사 인건비 산정 -->
            <a href="https://letter0033-star.github.io/timepay/" target="_blank" class="badge-card white-card card-5 p-4 gap-4">
                <div class="icon-box shadow-sm">
                    <i class="fas fa-hand-holding-usd text-xl"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-base md:text-lg font-extrabold text-slate-800 leading-tight">시간제교사 인건비 산정</span>
                    <p class="text-slate-500 text-xs font-medium">인건비 및 급여 계산</p>
                </div>
            </a>

            <!-- 배지 6: 준비중 -->
            <div class="badge-card white-card card-6 p-4 gap-4 opacity-80 cursor-default">
                <div class="icon-box shadow-sm">
                    <i class="fas fa-hourglass-half text-xl"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-base md:text-lg font-extrabold text-slate-400">준비중</span>
                    <p class="text-slate-400 text-xs font-medium">새로운 기능이 추가될 예정입니다</p>
                </div>
            </div>
        </main>

        <!-- 하단 안내 및 푸터 -->
        <div class="text-center pt-4 space-y-2">
            <p class="text-slate-500 text-[10px] md:text-[11px] font-medium">
                <i class="fas fa-envelope mr-1"></i> 프로그램 요청, 문의, 오류 신고: <span class="text-blue-600">letter0033@gmail.com</span>
            </p>
            <footer class="text-slate-400 text-[10px] md:text-xs">
                © 교감 인사업무 지원 포털
            </footer>
        </div>
    </div>

</body>
</html>
